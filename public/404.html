<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting to VigilAPI...</title>
    <script type="text/javascript">
      // GitHub Pages SPA 404 Fallback
      // Converts any direct static path to HashRouter format
      var repoPrefix = '/vigilapi';
      var path = window.location.pathname;
      var route = '';

      if (path.indexOf(repoPrefix) === 0) {
        route = path.substring(repoPrefix.length);
      } else {
        route = path;
      }

      if (route.startsWith('/')) {
        route = route.substring(1);
      }

      var target = window.location.origin + repoPrefix + '/#/' + route + window.location.search + window.location.hash;
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting to VigilAPI application...</p>
  </body>
</html>
